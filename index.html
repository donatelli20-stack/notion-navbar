<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Notion Navbar</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:transparent;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    background:#F5EDE5;
    color:#333;
    padding:12px 20px;
    border-radius:999px;
    font-weight:600;
    transition:.2s;
}

.navbar a:hover{
    transform:translateY(-2px);
}
</style>
</head>

<body>

<div class="navbar">
    <a href="#">🏠 Home</a>
    <a href="#">📅 Planner</a>
    <a href="#">🎯 Goals</a>
    <a href="#">💰 Finance</a>
    <a href="#">📝 Journal</a>
</div>

</body>
</html>
