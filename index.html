<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Notion Navbar</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:transparent;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    background:#F5EDE5;
    color:#333;
    padding:12px 20px;
    border-radius:999px;
    font-weight:600;
    transition:.2s;
}

.navbar a:hover{
    transform:translateY(-2px);
}
    
.dropdown{
    position:relative;
}
    
.dropdown-menu{
    display:none;
}

.dropdown:hover .dropdown-menu{
    display:block;
}

</style>
</head>

<body>

<div class="navbar">
    <a href="#">🏠 Home</a>
   <div class="dropdown">

    <a href="#">📅 Planner</a>

    <div class="dropdown-menu">

        <a href="#">Weekly Planner</a>

        <a href="#">Calendar</a>

        <a href="#">Tasks</a>

    </div>

</div>
    <a href="#">🎯 Goals</a>
    <a href="#">💰 Finance</a>
    <a href="#">📝 Journal</a>
</div>

</body>
</html>
